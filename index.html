<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--brand:#0f766e;--brand-ink:#fff;--warn:#fde68a;--bin:#f5c400}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f14;--card:#151b23;--ink:#e5e7eb;--mute:#9ca3af;--line:#263040;--brand:#14b8a6;--brand-ink:#04201d;--warn:#5b4a12}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
header b{font-size:17px}header small{color:var(--mute);display:block;font-size:12px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800}
main{max-width:560px;margin:0 auto;padding:16px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.photo{background:#fff;aspect-ratio:4/3;display:grid;place-items:center}.prod>.photo{aspect-ratio:16/9}.photo img{max-width:88%;max-height:88%;object-fit:contain}
.noimg{color:#9ca3af;font-size:14px}
.pbody{padding:16px}.pbody.top{padding-bottom:6px}.onhand{font-size:15px;margin:2px 0 8px}.warnline{color:#b45309;font-size:13px}.sent{text-align:left;background:var(--bg);border-radius:10px;padding:10px;font:14px/1.5 inherit;white-space:pre-wrap}
.binb{display:inline-block;background:var(--bin);color:#111;border:2px solid #111;border-radius:8px;font-weight:800;padding:0 8px;margin-right:6px}
h1{font-size:22px;margin:6px 0 2px;line-height:1.2}.sub{color:var(--mute);font-size:14px}
.stock{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.stock div{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stock b{display:block;font-size:24px}.stock span{color:var(--mute);font-size:13px}
.qtyrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 6px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stepper button{width:56px;height:56px;font-size:28px;border:0;background:var(--bg);color:var(--ink)}
.stepper input{width:86px;height:56px;border:0;text-align:center;font-size:24px;font-weight:700;background:var(--card);color:var(--ink)}
label.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
label.row small{display:block;color:var(--mute)}
.sw{appearance:none;width:52px;height:30px;border-radius:30px;background:#cbd5e1;position:relative;flex:none;transition:.15s}
.sw:checked{background:var(--brand)}.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}.sw:checked::after{left:25px}
.field{display:block;margin:10px 0}.field input{width:100%;margin-top:4px;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:var(--card);color:var(--ink)}
.go{display:block;width:100%;margin-top:16px;padding:16px;border:0;border-radius:14px;background:var(--brand);color:var(--brand-ink);font-size:18px;font-weight:700}
.go:disabled{opacity:.5}
.hint{color:var(--mute);font-size:13px;margin-top:10px;text-align:center}
.banner{background:var(--warn);border-radius:12px;padding:12px;margin-bottom:14px;font-size:14px}
.done{text-align:center;padding:30px 16px}.done .big{font-size:56px}
.list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit}
.tile .photo{aspect-ratio:1}.tile div.t{padding:8px;font-size:13px}
h2{font-size:15px;margin:22px 0 4px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
a{color:var(--brand)}
</style></head><body>

.jpg"}, {"id": "add-10-x-4-star-drive-wood-screw", "name": "#10 x 4\" star drive wood screw", "bin": null, "group": "Spears VMI items", "part": "STRPNT-XT1040Y", "vendor": "Spears", "at": 265, "full": 800, "note": "Spears VMI quote 1034111 (added 11/11/2026)", "link": "", "spears": true, "joke": false, "catalog": false, "suggest": 535, "img": "img/add-10-x-4-star-drive-wood-screw.jpg"}, {"id": "add-2-hole-90-degree-fitting-eg", "name": "2-hole 90 degree fitting EG", "bin": null, "group": "Spears VMI items", "part": "IPV-KF1026EG", "vendor": "Spears", "at": 30, "full": 95, "note": "Spears VMI quote 1034111 (added 11/11/2026)", "link": "", "spears": true, "joke": false, "catalog": false, "suggest": 65, "img": "img/add-2-hole-90-degree-fitting-eg.jpg"}]};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byId = Object.fromEntries(DATA.items.map((i) => [i.id, i]));
const NAME_KEY = "kanban_shop_name";
function getName(){ try { return localStorage.getItem(NAME_KEY) || ""; } catch (_) { return ""; } }
function setName(v){ try { localStorage.setItem(NAME_KEY, v); } catch (_) {} }
function photo(it){ return it.img ? `<img src="${esc(it.img)}" alt="${esc(it.name)}">` : `<span class="noimg">No photo</span>`; }
function title(it){ return (it.bin ? `<span class="binb">BIN ${esc(it.bin)}</span>` : "") + esc(it.name); }

function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  const m = h.match(/^([a-z0-9-]+)(?:\.([0-9a-f]{6}))?$/);
  const it = m && byId[m[1]];
  if (it) showItem(it, m[2] || ""); else showList();
  window.scrollTo(0, 0);
}

function showItem(it, code){
  const canOrder = !!code;
  const full = +it.full || 0;
  const stockLabel = it.spears ? "Bin full at" : "Order up to";
  const qtyBlock = it.joke ? `<div class="banner" style="text-align:center;font-size:20px;font-weight:800">TRY BEING A MAN!!</div>` : `
      <div class="qtyrow"><div><b>${it.spears ? "Qty to fill the bin" : "Qty to order"}</b><div class="sub">Brings you back to ${esc(full)}</div></div>
        <div class="stepper"><button type="button" id="minus" aria-label="less">−</button><input id="qty" type="number" inputmode="numeric" min="0" value="${esc(it.suggest)}"><button type="button" id="plus" aria-label="more">+</button></div></div>
      <div class="onhand" id="onhand"></div>
      ${it.spears ? `<p class="sub">Spears refills this bin — it goes on the Friday 12:00 PM Spears list.</p>` : `
      <label class="row"><span>Bypass Shop<small>Skip the shop receiving step</small></span><input class="sw" type="checkbox" id="bypass"${it.catalog ? "" : " checked"}></label>
      <label class="row"><span>Order right now<small>Off: waits for the Friday batch order</small></span><input class="sw" type="checkbox" id="now"></label>`}`;
  $("#app").innerHTML = `
    ${canOrder ? "" : `<div class="banner">Scan the QR on the card to order this item.</div>`}
    <div class="prod">
      <div class="pbody top">
        <h1>${title(it)}</h1>
        <div class="sub">${esc([it.catalog ? "piper.app part # " + it.part : it.part ? "Part # " + it.part : "", it.spears ? "Spears VMI" : it.vendor && it.vendor !== "piper.app" ? it.vendor : ""].filter(Boolean).join(" · "))}
          ${it.link && !it.catalog ? ` · <a href="${esc(it.link)}" target="_blank" rel="noopener noreferrer">vendor page</a>` : ""}</div>
        ${it.joke ? "" : `<div class="stock"><div><b>${esc(it.at)}</b><span>Reorder at or below</span></div><div><b>${esc(full)}</b><span>${stockLabel}</span></div></div>`}
      </div>
      <div class="photo">${photo(it)}</div>
      <div class="pbody">
        ${it.note && !it.joke ? `<div class="sub">${esc(it.note)}</div>` : ""}
        ${qtyBlock}
        <label class="field">Your name<input id="who" autocomplete="name" value="${esc(getName())}"></label>
        <label class="field">Note <small>(optional)</small><input id="note"></label>
        <button class="go" id="go"${canOrder ? "" : " disabled"}>${it.joke ? "Order" : it.spears ? "Add to Spears list" : "Order"}</button>
        <div class="hint" id="hint">${DATA.send && DATA.send.url ? "Goes straight to the Kanban board — on it within about 2 minutes." : "Opens your email with the order filled in — tap <b>Send</b>."}</div>
      </div>
    </div>
    <p class="hint"><a href="#">See all cards</a></p>`;
  const qty = $("#qty");
  const clamp = (v) => Math.max(0, Math.min(full || 1000, Math.round(+v || 0)));
  const onhand = () => full ? Math.max(0, full - clamp(qty.value)) : null;
  function showOnHand(){
    if (!qty) return;
    const oh = onhand();
    $("#onhand").innerHTML = oh == null ? "" : `On hand now: <b>${oh}</b> <span class="sub">(${esc(full)} − ${clamp(qty.value)})</span>` +
      (oh > (+it.at || 0) ? ` <span class="warnline">above the reorder point of ${esc(it.at)}</span>` : "");
  }
  if (qty) {
    $("#minus").onclick = () => { qty.value = Math.max(1, clamp(+qty.value - 1)); showOnHand(); };
    $("#plus").onclick = () => { qty.value = clamp(+qty.value + 1); showOnHand(); };
    qty.oninput = showOnHand;
    showOnHand();
  }
  $("#go").onclick = async () => {
    const who = $("#who").value.trim(); setName(who);
    const lines = [(it.bin ? `Bin ${it.bin} - ` : "") + it.name];
    if (qty) {
      const q = Math.max(1, clamp(qty.value));
      lines.push(`Qty: ${q}`);
      if (full) lines.push(`Left: ${Math.max(0, full - q)}`);
      if (!it.spears) lines.push(`Order now: ${$("#now").checked ? "yes" : "no"}`, `Bypass shop: ${$("#bypass").checked ? "yes" : "no"}`);
    }
    if (who) lines.push(`From: ${who}`);
    const note = $("#note").value.trim(); if (note) lines.push(`Note: ${note}`);
    const subject = `KANBAN ${it.id} ${code}`;
    const message = lines.join("\n");
    const href = `mailto:${DATA.to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(message + "\n\n(sent from the Prefab Kanban page - just tap Send)")}`;
    if (DATA.send && DATA.send.url) {
      const btn = $("#go"); btn.disabled = true; btn.textContent = "Sending…";
      try {
        // Plain-text POST (no custom headers = no CORS preflight). Line 1 = subject, rest = the order lines.
        const r = await fetch(DATA.send.url, { method: "POST", body: subject + "\n" + message });
        if (!r.ok) throw new Error("HTTP " + r.status);
        showSent(it, null, lines);
      } catch (e) {
        btn.disabled = false; btn.textContent = "Order";
        $("#hint").innerHTML = `Couldn't send (${esc(e.message)}). <a href="${esc(href)}">Send it by email instead</a>.`;
      }
      return;
    }
    showSent(it, href, lines);
    location.href = href;
  };
}

function showSent(it, href, lines){
  $("#app").innerHTML = href ? `<div class="prod done"><div class="big">✉️</div><h1>Now tap Send</h1>
    <p class="sub">Your email app opened with <b>${esc(it.name)}</b> filled in. Send it and it lands on the Kanban board.</p>
    <a class="go" href="${esc(href)}" style="text-decoration:none">Email didn't open? Tap here</a>
    <p class="hint"><a href="#">See all cards</a></p></div>`
  : `<div class="prod done"><div class="big">✅</div><h1>Order sent</h1>
    <p class="sub"><b>${esc(it.name)}</b> is on its way to the Kanban board — it shows up within about 2 minutes.</p>
    <pre class="sent">${esc(lines.slice(1).join("\n"))}</pre>
    <p class="hint"><a href="#">See all cards</a></p></div>`;
}

function showList(){
  const groups = {};
  DATA.items.forEach((i) => (groups[i.group] = groups[i.group] || []).push(i));
  $("#app").innerHTML = `<div class="banner">To order, scan the QR code on the card at the bin or shelf. This list is for looking things up.</div>` +
    Object.keys(groups).map((g) => `<h2>${esc(g)}</h2><div class="list">${groups[g].map((i) =>
      `<a class="tile" href="#${esc(i.id)}"><div class="photo">${photo(i)}</div><div class="t">${i.bin ? "<b>Bin " + esc(i.bin) + "</b> · " : ""}${esc(i.name)}</div></a>`).join("")}</div>`).join("");
}

window.addEventListener("hashchange", route);
route();
</script></body></html>
